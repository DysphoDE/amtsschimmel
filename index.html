<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2b20">
<meta name="description" content="Amtsschimmel – das Verwaltungs-Idle-Game: Von der Tontafel-Registratur in Ur bis zum Weltamt. Stempeln, sortieren, reformieren.">
<title>Amtsschimmel – Das Verwaltungs-Idle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<!--CONTENT-START-->
<link rel="stylesheet" href="css/style.css">
<!--HEAD-END-->
</head>
<body data-era="0" data-view="desk">
<!--BODY-START-->
<div id="app" class="app">
  <header class="topbar">
    <div class="brand" title="Amtsschimmel">
      <span class="brand-icon" data-icon="stempel"></span>
      <div class="brand-text"><h1>Amtsschimmel</h1><small>Das Verwaltungs-Idle</small></div>
    </div>
    <button class="era-badge" id="eraBadge" type="button" data-action="tab" data-tab="amt" aria-label="Epoche anzeigen">
      <span class="era-year" id="eraYear">2100 v. Chr.</span><span class="era-name" id="eraName">Tontafel-Registratur</span>
    </button>
    <div class="top-mini" id="topMini" aria-hidden="true"><span data-icon="akte"></span><b id="miniAkten">0</b><small id="miniSps"></small></div>
    <div class="top-actions">
      <button class="icon-btn" id="btnSound" type="button" aria-label="Ton an oder aus"></button>
      <button class="icon-btn" id="btnMusic" type="button" aria-label="Musik an oder aus"></button>
      <button class="icon-btn" id="btnOptions" type="button" data-action="tab" data-tab="optionen" aria-label="Optionen"></button>
    </div>
  </header>

  <div class="ticker" id="ticker">
    <span class="ticker-label">Amtsblatt</span>
    <div class="ticker-track"><span class="ticker-text" id="tickerText"></span></div>
  </div>

  <main class="layout">
    <!-- Schreibtisch -->
    <section class="col col-desk" id="colDesk" aria-label="Schreibtisch">
      <div class="counter" id="counter">
        <div class="counter-main"><span class="counter-icon" data-icon="akte"></span><span class="num" id="cntAkten">0</span></div>
        <div class="counter-word" id="cntWord">Akten</div>
        <div class="counter-sub"><b id="cntSps">0</b> pro Sekunde <span class="buff-x" id="cntBuff"></span></div>
        <div class="counter-v" id="cntVBox" hidden><span data-icon="para"></span><b id="cntV">0</b> Vorschriften <small>(+<span id="cntVps">0</span>/s)</small></div>
      </div>
      <div class="buffs" id="buffs" aria-live="polite"></div>
      <div class="desk-surface" id="deskSurface">
        <div class="tray tray-in" id="trayIn" aria-hidden="true"><div class="tray-papers"></div><span class="tray-label">Eingang</span><span class="tray-count" id="trayInCount"></span></div>
        <div class="doc-slot" id="docSlot"></div>
        <div class="tray tray-out" id="trayOut" aria-hidden="true"><div class="tray-papers"></div><span class="tray-label">Ausgang</span><span class="tray-count" id="trayOutCount"></span></div>
      </div>
      <div class="stampbar" id="stampbar" role="group" aria-label="Stempel"></div>
      <div class="flow" id="flowBox" hidden>
        <span class="flow-label"><span data-icon="fluss"></span>Arbeitsfluss</span>
        <div class="flow-bar"><i id="flowFill"></i></div>
        <span class="flow-text" id="flowText">0</span>
      </div>
      <div class="anliegen-slot" id="anliegenSlot"></div>
      <div class="mascot" id="mascot">
        <button class="mascot-head" id="mascotHead" type="button" aria-label="Den Amtsschimmel ansprechen"></button>
        <div class="mascot-bubble" id="mascotBubble" role="status" hidden></div>
        <p class="desk-hint" id="deskHint">Klicke auf die Akte oder drücke die <kbd>Leertaste</kbd>, um sie abzustempeln.</p>
      </div>
    </section>

    <!-- Reiter -->
    <section class="col col-panel" id="colPanel" aria-label="Verwaltung">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="panel-body" id="panelBody"></div>
    </section>

    <!-- Haushalt -->
    <section class="col col-shop" id="colShop" aria-label="Haushalt">
      <div class="shop" id="shop"></div>
    </section>
  </main>

  <nav class="mobile-nav" id="mobileNav" aria-label="Bereiche"></nav>
</div>

<div class="schimmel-layer" id="schimmelLayer"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="floaters" id="floaters" aria-hidden="true"></div>
<div id="modalRoot"></div>
<div class="sr-only" id="srLive" aria-live="polite"></div>
<noscript><div class="noscript">Amtsschimmel braucht JavaScript. Ohne JavaScript gibt es leider nur das Formular zur Beantragung von JavaScript.</div></noscript>
<!--CONTENT-END-->
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/systems.js"></script>
<script src="js/content.js"></script>
<script src="js/achievements.js"></script>
<script src="js/core.js"></script>
<script src="js/icons.js"></script>
<script src="js/audio.js"></script>
<script src="js/desk.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
