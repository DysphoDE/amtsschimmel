<style>
/* Amtsschimmel – Gestaltung
   Leitmotiv: Amtsstube. Aktendeckel, Papier, Stempelfarbe. Jede Epoche hat eigene Wand, eigenen Schreibtisch und eigene Akten. */

:root {
  --ink: #2b2420;
  --ink-soft: #6b5e52;
  --ink-faint: #9a8d7f;
  --paper: #fbf6e9;
  --paper-2: #f3ead4;
  --paper-3: #e7dbbd;
  --folder: #e6d29e;
  --folder-2: #d6bd7c;
  --folder-edge: #b89c5a;
  --red: #b3261e;
  --red-ink: rgba(179, 38, 30, .86);
  --blue: #2a4c9a;
  --blue-ink: rgba(42, 76, 154, .84);
  --green: #2c8549;
  --gold: #c9a24a;
  --warn: #c7741a;
  --shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 2px 0 rgba(0,0,0,.08), 0 6px 18px rgba(30, 18, 8, .18);
  --shadow-sm: 0 1px 2px rgba(30, 18, 8, .22);
  --radius: 8px;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-serif: Georgia, "Times New Roman", "DejaVu Serif", serif;
  --font-mono: "Courier New", Courier, "Nimbus Mono PS", ui-monospace, monospace;
  --wall1: #b98d5e; --wall2: #8a6440;
  --desk1: #7a5b3f; --desk2: #5b412b;
  --accent: #b5651d;
  --top-h: 56px; --ticker-h: 30px; --nav-h: 0px;
  color-scheme: light;
}
body[data-era="1"] { --wall1: #d8d0c0; --wall2: #a99f8c; --desk1: #e8e2d5; --desk2: #b9b09d; --accent: #9b2d20; }
body[data-era="2"] { --wall1: #6b4a32; --wall2: #3f2a1c; --desk1: #8a5a36; --desk2: #5e3b22; --accent: #b3261e; }
body[data-era="3"] { --wall1: #3e5a63; --wall2: #22343a; --desk1: #5b3d27; --desk2: #3d2818; --accent: #2f4f7a; }
body[data-era="4"] { --wall1: #6d2f2f; --wall2: #3f1b1b; --desk1: #4c3020; --desk2: #2f1c12; --accent: #b88a2e; }
body[data-era="5"] { --wall1: #c07a3a; --wall2: #7a4a22; --desk1: #a87a4b; --desk2: #7a5532; --accent: #d06a14; }
body[data-era="6"] { --wall1: #a8a296; --wall2: #6f6a60; --desk1: #8e8c86; --desk2: #66645e; --accent: #2f8f4e; }
body[data-era="7"] { --wall1: #cfdbe8; --wall2: #8ea6c0; --desk1: #e9edf2; --desk2: #b9c4d0; --accent: #1f5fae; }
body[data-era="8"] { --wall1: #163038; --wall2: #0a171c; --desk1: #1d3a44; --desk2: #0f2329; --accent: #1fa9a9; }
body[data-era="9"] { --wall1: #1a1636; --wall2: #07061a; --desk1: #221d48; --desk2: #0e0b26; --accent: #c9a24a; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.4;
  color: var(--ink);
  background-color: var(--wall2);
  background-image:
    radial-gradient(ellipse at 30% 0%, rgba(255,255,255,.14), transparent 60%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.035) 0 2px, transparent 2px 46px),
    linear-gradient(180deg, var(--wall1), var(--wall2));
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  transition: background-color .8s;
}
button { font: inherit; color: inherit; }
button:not(:disabled) { cursor: pointer; }
:focus-visible { outline: 3px solid #f1b52b; outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
kbd { font-family: var(--font-mono); font-size: .85em; padding: 0 .35em; border: 1px solid currentColor; border-radius: 4px; border-bottom-width: 2px; opacity: .85; }
svg { display: block; width: 100%; height: 100%; }
[data-icon] { display: inline-block; width: 1.2em; height: 1.2em; vertical-align: -.22em; flex: none; }

/* ---------- Kopfzeile ---------- */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.topbar {
  height: var(--top-h); flex: none;
  display: flex; align-items: center; gap: 12px; padding: 0 12px;
  background: linear-gradient(180deg, #3a2b20, #2a1f17);
  color: #f4e9d2;
  border-bottom: 3px solid var(--accent);
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
  position: relative; z-index: 5;
  padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right));
}
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand-icon { width: 34px; height: 34px; background: #f4e9d2; border-radius: 50%; padding: 4px; box-shadow: 0 0 0 2px var(--accent); }
.brand-icon svg { width: 100%; height: 100%; }
.brand h1 { font-family: var(--font-serif); font-size: 21px; letter-spacing: .06em; margin: 0; font-weight: 700; font-variant: small-caps; line-height: 1; }
.brand small { font-size: 11px; opacity: .75; letter-spacing: .04em; }
.era-badge {
  margin-left: auto; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); border-radius: 18px;
  padding: 3px 12px; display: flex; flex-direction: column; align-items: center; line-height: 1.15; color: #f4e9d2; min-width: 0;
}
.era-badge:hover { background: rgba(255,255,255,.15); }
.era-year { font-family: var(--font-mono); font-size: 11px; opacity: .8; }
.era-name { font-family: var(--font-serif); font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.top-mini { display: none; align-items: center; gap: 5px; font-family: var(--font-serif); }
.top-mini b { font-size: 16px; }
.top-mini small { opacity: .75; font-size: 11px; }
.top-actions { display: flex; gap: 6px; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(0,0,0,.35); background: #f4e9d2; padding: 6px; display: grid; place-items: center; box-shadow: 0 0 0 2px rgba(255,255,255,.12); }
.icon-btn:hover { background: #fff; }
.icon-btn[aria-pressed="false"] { background: #cdbfa6; }
.icon-btn svg { width: 22px; height: 22px; }

/* ---------- Laufband ---------- */
.ticker {
  height: var(--ticker-h); flex: none; display: flex; align-items: center; overflow: hidden;
  background: var(--paper-2); border-bottom: 1px solid var(--folder-edge); font-family: var(--font-serif); font-size: 14px;
}
.ticker-label { flex: none; padding: 0 10px; height: 100%; display: flex; align-items: center; background: var(--red); color: #fff; font-family: var(--font-ui); font-weight: 700; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.ticker-track { flex: 1; overflow: hidden; white-space: nowrap; position: relative; height: 100%; }
.ticker-text { position: absolute; left: 0; top: 50%; transform: translate(100vw, -50%); white-space: nowrap; will-change: transform; }
body.no-ticker .ticker { display: none; }

/* ---------- Spalten ---------- */
.layout {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: minmax(380px, 1.1fr) minmax(360px, 1fr) minmax(340px, .95fr);
  gap: 10px; padding: 10px; padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right));
}
.col { min-height: 0; min-width: 0; border-radius: 10px; }
.col-panel, .col-shop { display: flex; flex-direction: column; }

/* Schreibtisch */
.col-desk {
  position: relative; overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 18%, rgba(255,240,200,.35), transparent 62%),
    repeating-linear-gradient(8deg, rgba(0,0,0,.045) 0 1px, transparent 1px 9px),
    linear-gradient(180deg, var(--desk1), var(--desk2));
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.18), inset 0 0 40px rgba(0,0,0,.25), var(--shadow);
  display: flex; flex-direction: column; align-items: center; padding: 12px 12px 10px;
  color: #fff8e8;
  container-type: inline-size; container-name: desk;
}
body[data-era="1"] .col-desk, body[data-era="7"] .col-desk { color: var(--ink); }
.counter { text-align: center; padding: 4px 8px 6px; text-shadow: 0 1px 2px rgba(0,0,0,.45); user-select: none; }
body[data-era="1"] .counter, body[data-era="7"] .counter { text-shadow: 0 1px 0 rgba(255,255,255,.6); }
.counter-main { display: flex; align-items: center; justify-content: center; gap: 8px; }
.counter-icon { width: 34px; height: 34px; }
.counter .num { font-family: var(--font-serif); font-weight: 700; font-size: clamp(30px, 4.4vw, 46px); line-height: 1; font-variant-numeric: lining-nums tabular-nums; letter-spacing: .01em; }
.counter-word { font-family: var(--font-serif); font-size: 16px; font-style: italic; opacity: .92; margin-top: 2px; min-height: 1.2em; }
.counter-sub { font-size: 13.5px; opacity: .92; }
.counter-sub b { font-family: var(--font-serif); font-size: 15px; }
.buff-x { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 9px; background: #f1b52b; color: #3a2b20; font-weight: 700; font-size: 12px; text-shadow: none; }
.buff-x:empty { display: none; }
.counter-v { font-size: 13px; opacity: .9; margin-top: 3px; display: flex; align-items: center; justify-content: center; gap: 4px; }
.counter-v [data-icon] { width: 17px; height: 17px; }
.counter-v b { font-family: var(--font-serif); }

.buffs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; min-height: 26px; margin: 2px 0 4px; }
.buff {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600;
  background: rgba(251, 246, 233, .95); color: var(--ink); border-radius: 13px; padding: 2px 9px 2px 4px; box-shadow: var(--shadow-sm);
  position: relative; overflow: hidden;
}
.buff [data-icon] { width: 18px; height: 18px; }
.buff.bad { background: #f3d6d0; }
.buff i { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--red); }

.desk-surface { position: relative; width: 100%; flex: 1; min-height: 250px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.tray { width: 74px; height: 92px; position: relative; flex: none; align-self: center; opacity: .95; }
.tray::before { content: ''; position: absolute; inset: 30px 0 0; border: 3px solid rgba(40,40,46,.75); border-top: none; border-radius: 0 0 8px 8px; background: repeating-linear-gradient(90deg, rgba(40,40,46,.55) 0 2px, transparent 2px 9px); }
.tray-papers { position: absolute; left: 7px; right: 7px; bottom: 6px; height: 64px; }
.tray-papers i { position: absolute; left: 0; right: 0; height: 52px; background: var(--paper); border-radius: 2px; box-shadow: 0 1px 1px rgba(0,0,0,.25); }
.tray-label { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
.tray-count { position: absolute; top: 0; right: -4px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
.tray-count:empty { display: none; }

/* ---------- Die Akte ---------- */
.doc-slot { position: relative; width: min(300px, 100%); height: clamp(250px, 38vh, 330px); flex: none; perspective: 900px; }
@container desk (max-width: 500px) { .tray { display: none; } }
.doc {
  position: absolute; inset: 0; border-radius: 4px; padding: 16px 18px 14px;
  background: var(--paper); color: var(--ink);
  box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 3px 0 rgba(0,0,0,.06), 0 12px 26px rgba(0,0,0,.35);
  display: flex; flex-direction: column; gap: 6px; overflow: hidden;
  cursor: pointer; user-select: none; touch-action: manipulation;
  transition: transform .32s cubic-bezier(.3,.8,.3,1), opacity .32s;
  transform-origin: 50% 80%;
  font-family: var(--font-mono);
}
.doc:focus-visible { outline-offset: 4px; }
.doc.enter { transform: translateX(-120%) rotate(-12deg); opacity: 0; }
.doc.leave { transform: translateX(130%) translateY(-20px) rotate(14deg); opacity: 0; pointer-events: none; }
.doc.leave-back { transform: translateX(-130%) rotate(-16deg) scale(.9); opacity: 0; pointer-events: none; }
.doc.leave-miss { transform: translateY(70%) rotate(6deg); opacity: 0; pointer-events: none; }
.doc.thump { animation: thump .16s ease-out; }
@keyframes thump { 0% { transform: scale(1); } 40% { transform: scale(.985) translateY(2px); } 100% { transform: scale(1); } }
.doc.shake { animation: shake .32s; }
@keyframes shake { 20% { transform: translateX(-8px) rotate(-1deg); } 40% { transform: translateX(7px) rotate(1deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
.doc-head { display: flex; justify-content: space-between; align-items: flex-start; font-size: 10.5px; color: var(--ink-soft); gap: 8px; border-bottom: 1px solid rgba(0,0,0,.15); padding-bottom: 6px; }
.doc-amt { font-family: var(--font-serif); font-weight: 700; color: var(--ink); font-size: 12px; letter-spacing: .02em; }
.doc-az { text-align: right; white-space: nowrap; }
.doc-kind { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); margin-top: 4px; }
.doc-title { font-family: var(--font-serif); font-size: 18px; line-height: 1.22; font-weight: 700; color: var(--ink); }
.doc-who { font-size: 11.5px; color: var(--ink-soft); }
.doc-lines { flex: 1; display: flex; flex-direction: column; gap: 7px; padding-top: 4px; opacity: .55; }
.doc-lines i { height: 1px; background: rgba(0,0,0,.25); }
.doc-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; font-size: 10.5px; color: var(--ink-soft); min-height: 30px; }
.doc-pips { display: flex; gap: 4px; }
.doc-pips i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink-soft); }
.doc-pips i.on { background: var(--red); border-color: var(--red); }
.doc-sticker {
  position: absolute; top: 10px; right: 10px; width: 58px; height: 58px; border-radius: 50%;
  display: grid; place-items: center; padding: 10px; color: #fff;
  box-shadow: 0 2px 4px rgba(0,0,0,.3), inset 0 0 0 3px rgba(255,255,255,.55);
  transform: rotate(8deg);
}
.doc-sticker svg { width: 34px; height: 34px; filter: drop-shadow(0 1px 0 rgba(0,0,0,.25)); }
.doc-sticker b { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%) rotate(-8deg); white-space: nowrap; font-family: var(--font-ui); font-size: 10.5px; font-weight: 700; color: var(--ink); background: var(--paper); padding: 0 5px; border-radius: 3px; box-shadow: var(--shadow-sm); }
.doc.has-sticker .doc-head { padding-right: 62px; }
.doc.has-sticker .doc-title { padding-right: 46px; }
.doc-band { margin: -16px -18px 4px; padding: 5px 18px; font-family: var(--font-ui); font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #fff; display: flex; justify-content: space-between; align-items: center; }
.doc-band.eilt { background: #d6402c; }
.doc-band.wider { background: #5a4a8a; }
.doc-band.gross { background: #2f6b5a; }
.doc-timer { height: 4px; background: rgba(255,255,255,.4); border-radius: 2px; width: 90px; overflow: hidden; }
.doc-timer i { display: block; height: 100%; background: #fff; transform-origin: left; }
.doc-seq { display: flex; align-items: center; gap: 4px; font-family: var(--font-ui); font-size: 11px; }
.doc-seq span { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; padding: 4px; opacity: .45; border: 2px solid transparent; }
.doc-seq span.now { opacity: 1; border-color: var(--ink); transform: scale(1.12); }
.doc-seq span.done { opacity: 1; filter: grayscale(.6); }
.doc-seq em { font-style: normal; opacity: .6; }

/* Stempelabdrücke */
.imprint {
  position: absolute; pointer-events: none; font-family: var(--font-ui); font-weight: 900; text-transform: uppercase; letter-spacing: .08em;
  border: 3px solid currentColor; border-radius: 6px; padding: 2px 8px; line-height: 1.15; text-align: center; white-space: nowrap;
  color: var(--red-ink); mix-blend-mode: multiply; opacity: 0;
  animation: imprint .28s ease-out forwards;
  -webkit-mask-image: radial-gradient(circle at 30% 40%, #000 55%, rgba(0,0,0,.65) 70%, #000 85%);
          mask-image: radial-gradient(circle at 30% 40%, #000 55%, rgba(0,0,0,.65) 70%, #000 85%);
}
.imprint small { display: block; font-size: .55em; letter-spacing: .12em; font-weight: 700; }

@keyframes imprint { 0% { opacity: 0; transform: var(--rot) scale(1.6); } 60% { opacity: .95; transform: var(--rot) scale(.96); } 100% { opacity: .88; transform: var(--rot) scale(1); } }

/* ---------- Stempelleiste ---------- */
.stampbar { display: flex; justify-content: center; gap: 6px; flex-wrap: nowrap; margin-top: 6px; min-height: 8px; width: 100%; max-width: 480px; }
.stamp-btn {
  position: relative; flex: 0 1 74px; min-width: 46px; height: 84px; border: none; background: none; padding: 0; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end; touch-action: manipulation;
  transition: transform .08s;
}
.stamp-btn::before { /* Griff */
  content: ''; position: absolute; top: 2px; left: 50%; width: 26px; height: 34px; transform: translateX(-50%);
  background: radial-gradient(ellipse at 40% 25%, #b48058, #6b4429 70%); border-radius: 13px 13px 6px 6px;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), 0 2px 3px rgba(0,0,0,.35);
}
.stamp-face {
  position: relative; width: 100%; height: 46px; border-radius: 6px; background: var(--rc, #555);
  box-shadow: inset 0 3px 0 rgba(255,255,255,.25), inset 0 -4px 0 rgba(0,0,0,.25), 0 3px 5px rgba(0,0,0,.35);
  display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; gap: 1px;
}
.stamp-face [data-icon] { width: 22px; height: 22px; }
.stamp-face span { font-size: 10.5px; font-weight: 700; letter-spacing: .02em; text-shadow: 0 1px 1px rgba(0,0,0,.4); max-width: 66px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stamp-key { position: absolute; top: 4px; right: 6px; font: 700 10px/16px var(--font-mono); width: 16px; height: 16px; border-radius: 4px; background: rgba(251,246,233,.92); color: var(--ink); box-shadow: var(--shadow-sm); }
.stamp-btn:active, .stamp-btn.pressed { transform: translateY(4px) scale(.97); }
.stamp-btn.hint .stamp-face { box-shadow: 0 0 0 3px #f1b52b, 0 0 16px 4px rgba(241,181,43,.75), inset 0 -4px 0 rgba(0,0,0,.25); }
.stamp-btn.flash-ok .stamp-face { animation: okflash .35s; }
.stamp-btn.flash-bad .stamp-face { animation: badflash .4s; }
@keyframes okflash { 50% { filter: brightness(1.4); } }
@keyframes badflash { 25%, 75% { transform: translateX(-4px); filter: saturate(.3); } 50% { transform: translateX(4px); } }

.flow { display: flex; align-items: center; gap: 8px; width: min(440px, 100%); margin-top: 8px; font-size: 12px; font-weight: 600; }
.flow-label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.flow-label [data-icon] { width: 18px; height: 18px; }
.flow-bar { flex: 1; height: 10px; border-radius: 5px; background: rgba(255,255,255,.22); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.25); }
.flow-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #5fb3e6, #f1b52b, #e3553f); border-radius: 5px; transition: width .2s; }
.flow-text { min-width: 64px; text-align: right; font-family: var(--font-serif); }
.desk-hint { font-size: 12.5px; opacity: .85; margin: 6px 0 0; text-align: center; min-height: 1.2em; }

/* Maskottchen */
.mascot { position: relative; align-self: stretch; margin-top: auto; display: flex; align-items: flex-end; gap: 8px; z-index: 4; min-height: 50px; padding-top: 4px; }
.mascot-head { pointer-events: auto; width: 62px; height: 54px; border: none; background: none; padding: 0; flex: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); transition: transform .2s; }

.mascot-bubble {

  box-shadow: var(--shadow); flex: 1; margin-bottom: 12px; position: relative; animation: pop .25s; text-shadow: none;
}

@keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.anliegen-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px 2px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }

/* ---------- Reiter & Papierflächen ---------- */
.tabs { display: flex; gap: 3px; padding: 0 8px; overflow-x: auto; scrollbar-width: none; flex: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {

  display: flex; align-items: center; gap: 5px; box-shadow: inset 0 -3px 4px -2px rgba(0,0,0,.18); position: relative; top: 1px; white-space: nowrap;
}

.panel-body, .shop {

}

.shop { padding-top: 10px; }

.muted { color: var(--ink-soft); }
.small { font-size: 12.5px; }
p { margin: 6px 0; }
.card { background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow-sm), 0 0 0 1px rgba(0,0,0,.06); padding: 10px 12px; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }

/* Knöpfe */
.btn {
  border: 2px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 7px; padding: 6px 12px; font-weight: 700; font-size: 13px;
  box-shadow: 0 2px 0 var(--ink); transition: transform .06s, box-shadow .06s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center;
}
.btn:hover:not(:disabled) { background: #fff; }

.cost { font-family: var(--font-serif); font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; gap: 3px; }

.bar { height: 8px; background: rgba(0,0,0,.12); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .3s; }

/* ---------- Haushalt ---------- */
.shop-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }

.amt-toggle { margin-left: auto; display: inline-flex; border: 2px solid var(--ink); border-radius: 7px; overflow: hidden; }

.up-list { display: flex; flex-direction: column; gap: 5px; }

  display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; text-align: left; width: 100%;

/* ---------- Amtsstube ---------- */

.form-card .rar { display: block; font-family: var(--font-ui); font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--rcol); margin-bottom: 2px; }

.r-g { --rcol: #7d8a94; } .r-s { --rcol: #2a62a8; } .r-a { --rcol: #8b3fb0; } .r-l { --rcol: #c98a12; }

/* Reform & Laufbahn */
.reform-box { background: var(--paper); border-radius: 10px; padding: 12px; box-shadow: var(--shadow-sm); }

.lb-card { text-align: left; background: var(--paper); border: 2px solid rgba(0,0,0,.12); border-radius: 9px; padding: 9px 11px; display: flex; flex-direction: column; gap: 4px; box-shadow: var(--shadow-sm); position: relative; }

/* Urkunden */

/* Statistik & Optionen */
.stats-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.stats-table td { padding: 4px 6px; border-bottom: 1px dotted var(--folder-edge); }
.stats-table td:last-child { text-align: right; font-family: var(--font-serif); font-weight: 700; }

.opt-row label { flex: 1; min-width: 160px; }

.switch { position: relative; width: 44px; height: 24px; border-radius: 12px; border: 2px solid var(--ink); background: var(--paper-3); padding: 0; flex: none; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--green); }

textarea.save-box { width: 100%; min-height: 90px; font: 12px var(--font-mono); border-radius: 6px; border: 1.5px solid var(--ink); padding: 6px; background: var(--paper); resize: vertical; }

/* ---------- Meldungen ---------- */
.toasts { position: fixed; right: 14px; bottom: 14px; z-index: 40; display: flex; flex-direction: column-reverse; gap: 8px; width: min(340px, calc(100vw - 28px)); pointer-events: none; }
.toast {
  pointer-events: auto; background: var(--paper); color: var(--ink); border-radius: 9px; box-shadow: 0 8px 22px rgba(0,0,0,.35); padding: 9px 12px 9px 10px;
  display: grid; grid-template-columns: 34px 1fr; gap: 9px; align-items: center; border-left: 5px solid var(--accent); animation: toastin .3s cubic-bezier(.3,.8,.3,1);
}
.toast.out { animation: toastout .3s forwards; }
@keyframes toastin { from { transform: translateX(40px); opacity: 0; } }
@keyframes toastout { to { transform: translateX(40px); opacity: 0; } }
.toast [data-icon] { width: 34px; height: 34px; }
.toast .t-kicker { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.toast .t-title { font-family: var(--font-serif); font-weight: 700; font-size: 15px; line-height: 1.2; }
.toast .t-text { font-size: 12.5px; color: var(--ink-soft); }
.toast.gold { border-left-color: var(--gold); }
.toast.green { border-left-color: var(--green); }
.toast.red { border-left-color: var(--red); }
.toast.blue { border-left-color: var(--blue); }

.floaters { position: fixed; inset: 0; pointer-events: none; z-index: 35; overflow: hidden; }
.floater { position: absolute; font-family: var(--font-serif); font-weight: 700; font-size: 17px; color: #fff; text-shadow: 0 1px 0 #000, 0 0 6px rgba(0,0,0,.6); white-space: nowrap; animation: floatup 1s ease-out forwards; transform: translate(-50%, -50%); }
.floater.big { font-size: 22px; color: #ffe08a; }
.floater.bad { color: #ffb3a8; }
.floater.v { color: #cfe3ff; font-size: 15px; }
@keyframes floatup { to { transform: translate(-50%, -150%); opacity: 0; } }

/* Der Amtsschimmel galoppiert */
.schimmel-layer { position: fixed; inset: 0; pointer-events: none; z-index: 32; overflow: hidden; }
.schimmel {
  position: absolute; width: 184px; height: 134px; pointer-events: auto; cursor: pointer; border: none; background: none; padding: 0;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.45)); animation: gallop-x var(--dur, 13s) linear forwards;
}
.schimmel.rtl { animation-name: gallop-x-rtl; }
.schimmel.rtl svg { transform: scaleX(-1); }
.schimmel svg { animation: bob .32s ease-in-out infinite alternate; overflow: visible; }
.schimmel .sch-leg { transform-box: fill-box; transform-origin: 50% 0; animation: leg .32s ease-in-out infinite alternate; }
.schimmel .sch-leg-f2, .schimmel .sch-leg-b1 { animation-direction: alternate-reverse; }
.schimmel .sch-head { transform-box: fill-box; transform-origin: 0 100%; animation: nod .32s ease-in-out infinite alternate; }
.schimmel .sch-tail { transform-box: fill-box; transform-origin: 100% 0; animation: nod .32s ease-in-out infinite alternate-reverse; }
.schimmel::after { content: 'Fang mich!'; position: absolute; top: -22px; left: 50%; transform: translateX(-50%); background: var(--paper); color: var(--ink); font: 700 12px var(--font-ui); padding: 2px 8px; border-radius: 10px; white-space: nowrap; box-shadow: var(--shadow-sm); }
.schimmel.caught { animation: caught .5s forwards; }
@keyframes gallop-x { from { left: -200px; } to { left: calc(100% + 20px); } }
@keyframes gallop-x-rtl { from { left: calc(100% + 20px); } to { left: -200px; } }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-7px); } }
@keyframes leg { from { transform: rotate(-24deg); } to { transform: rotate(24deg); } }
@keyframes nod { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
@keyframes caught { to { transform: scale(1.5) translateY(-30px); opacity: 0; } }

/* Dialoge */
.modal-back { position: fixed; inset: 0; background: rgba(20,12,6,.6); z-index: 50; display: grid; place-items: center; padding: 16px; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.modal {
  width: min(560px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--paper); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  padding: 18px 20px; position: relative; border-top: 6px solid var(--accent); animation: pop .25s;
}
.modal h2 { font-family: var(--font-serif); margin: 0 0 8px; font-size: 22px; }

.modal.era-modal { text-align: center; }

.modal.era-modal .era-text { font-family: var(--font-serif); font-size: 16px; }
.modal .new-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 12px 0 4px; }
.modal .new-list span { display: flex; flex-direction: column; align-items: center; width: 92px; font-size: 11.5px; font-weight: 600; gap: 3px; text-align: center; }
.modal .new-list span [data-icon] { width: 46px; height: 46px; }

/* Finale */
.finale { position: fixed; inset: 0; z-index: 60; background: radial-gradient(ellipse at 50% 30%, #2a2458, #07061a 70%); color: #f6e7b8; display: grid; place-items: center; text-align: center; padding: 20px; animation: fade 1s; overflow-y: auto; }
.finale h2 { font-family: var(--font-serif); font-size: clamp(26px, 5vw, 44px); margin: 0 0 10px; }
.finale p { font-family: var(--font-serif); font-size: 17px; max-width: 620px; margin: 8px auto; }
.finale .big-button { width: 180px; height: 180px; border-radius: 50%; border: none; margin: 20px auto; display: block; background: radial-gradient(circle at 40% 30%, #ff6a5a, #b3261e 60%, #6e140f); box-shadow: 0 10px 0 #4a0d09, 0 18px 40px rgba(0,0,0,.6), inset 0 6px 12px rgba(255,255,255,.35); color: #fff; font: 800 20px var(--font-ui); letter-spacing: .1em; text-transform: uppercase; }
.finale .big-button:active { transform: translateY(8px); box-shadow: 0 2px 0 #4a0d09, 0 8px 20px rgba(0,0,0,.6); }

@keyframes printout { from { transform: translateY(-30px); clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }

.noscript { position: fixed; inset: 0; display: grid; place-items: center; background: var(--paper); font: 18px var(--font-serif); padding: 20px; text-align: center; z-index: 100; }

  const SHORT = ['', 'Tsd.', 'Mio.', 'Mrd.', 'Bio.', 'Brd.', 'Trio.', 'Trd.', 'Quadr.', 'Quadrd.', 'Quint.', 'Quintd.',
    'Sext.', 'Sextd.', 'Sept.', 'Septd.', 'Okt.', 'Oktd.', 'Non.', 'Nond.', 'Dez.', 'Dezd.'];
  const LONG = ['', 'Tausend', 'Million', 'Milliarde', 'Billion', 'Billiarde', 'Trillion', 'Trilliarde', 'Quadrillion',
    'Quadrilliarde', 'Quintillion', 'Quintilliarde', 'Sextillion', 'Sextilliarde', 'Septillion', 'Septilliarde',
    'Oktillion', 'Oktilliarde', 'Nonillion', 'Nonilliarde', 'Dezillion', 'Dezilliarde'];
  const plural = (w) => (w === 'Tausend' ? w : w.endsWith('e') ? w + 'n' : w + 'en');

  // 'kurz' = 1,23 Mio. · 'lang' = 1,23 Millionen · 'wiss' = 1,23e6

  // Abschneiden statt Runden, damit nie „1.000 Mio.“ erscheint

    if (m < 1) { m *= 1000; e3--; }

    const s = dec(trunc(m, d), d);

  };

  let rnd = Math.random;

        case 'cost': F.cost *= e.x; break;
        case 'upCost': F.upCost *= e.x; break;
        case 'paraCost': F.paraCost *= e.x; break;
        case 'projCost': F.projCost *= e.x; break;
        case 'offEff': F.offEff += e.a; break;
        case 'offCap': F.offCap += e.a; break;
        case 'auto': F.auto += e.a; break;
        case 'dj': F.djX *= e.x; break;
        case 'djGain': F.djGain *= e.x; break;
        case 'syn': F.syn.push(e); break;
        case 'flatPer': F.flatPer[e.id] = (F.flatPer[e.id] || 0) + e.a; break;
        case 'assist': F.assist = true; break;
        case 'ressortMax': F.ressortMax = Math.min(F.ressortMax, e.n); break;
        case 'divers': F.divers = e; break;
        case 'chaos': F.chaos = true; break;
        case 'flag': F.flags[e.f] = true; break;
        default: break;
      }
    }
  }

  C.totalGens = () => { let n = 0; for (const k in S.gens) n += S.gens[k]; return n; };
  C.totalGrem = () => { let n = 0; for (const k in S.grem) n += S.grem[k]; return n; };
  C.ordnerComplete = function () {
    let n = 0;
    for (const o of D.ORDNER) if (D.FORMS.every((f) => f.ordner !== o.id || S.forms[f.id])) n++;
    return n;
  };
  C.isOrdnerComplete = (oid) => D.FORMS.every((f) => f.ordner !== oid || S.forms[f.id]);
  C.duplicateForms = () => { let n = 0; for (const k in S.forms) n += Math.max(0, S.forms[k] - 1); return n; };
  C.visitedCount = () => Object.keys(S.visited).length;

  /** Alles Statische neu berechnen (nach Käufen, Reformen, Urkunden …) */
  C.recalc = function () {
    const F = baseF();
    for (const id in S.ups) if (D.UP[id]) applyFx(F, D.UP[id].fx);
    for (const id in S.paras) if (D.PARA[id]) applyFx(F, D.PARA[id].fx);
    for (const id in S.perks) if (D.PERK[id]) applyFx(F, D.PERK[id].fx);
    const lb = D.LB[S.leitbild] || D.LB.kameral;
    applyFx(F, lb.fx);
    for (const id in S.forms) { const f = D.FORM[id]; if (f) F.prodAdd += D.RARITY[f.r].bonus; }
    for (const o of D.ORDNER) if (C.isOrdnerComplete(o.id)) applyFx(F, o.fx);
    F.prodAdd += 0.01 * Object.keys(S.ach).length;
    F.prodAdd += FIRST_VISIT * Math.max(0, Object.keys(S.visited).length - 1);
    for (const p of D.PROJECTS) if (S.projects[p.id] && S.projects[p.id].done) applyFx(F, p.fx);
    if (S.finale.done) F.prodX *= 2;
    if (S.stufe) F.prodX *= Math.pow(1 + D.STUFE.bonus, S.stufe);
    M.F = F;

    const total = C.totalGens();
    M.unit = {};
    for (const g of D.GENS) {
      const n = S.gens[g.id] || 0;
      const base = g.prod + (F.flatPer[g.id] || 0) * (total - n);
      let syn = 0;
      for (const s of F.syn) if (s.id === g.id) syn += s.a * (S.gens[s.src] || 0);
      M.unit[g.id] = base * (F.gen[g.id] || 1) * F.cat[g.cat] * (1 + syn);
    }
    let divers = 1;
    if (F.divers) {
      let k = 0;
      for (const g of D.GENS) if ((S.gens[g.id] || 0) >= F.divers.min) k++;
      divers = 1 + F.divers.a * k;
    }
    M.divers = divers;
    M.djMult = 1 + DJ_EFFECT * S.dj * F.djX;
    M.muede = F.flags.noMuede ? 1 : 1 - MUEDE * S.streak;
    // Gremien-Bonus mit abnehmendem Ertrag: volle Wirkung für die ersten 25, danach mit der Wurzel
    const ng = C.totalGrem();
    M.gremEff = ng <= 25 ? ng : 25 + 5 * (Math.sqrt(ng) - 5);
    M.staticG = F.prodX * (1 + F.prodAdd + F.perGrem * M.gremEff) * M.djMult * M.muede * divers;
    M.ressorts = C.activeRessorts();
    C.dyn();
  };

  /** Dynamische Werte (Buffs, Vorschriften-Bonus) – jeden Tick */
  C.dyn = function () {
    const F = M.F;
    M.rechts = 1 + 0.03 * Math.log2(1 + S.vor) * F.rechtsX;
    let prodBuff = 1, clickBuff = 1, stampBuff = 1, costBuff = 1;
    const genBuff = {};
    for (const b of S.buffs) {
      if (b.k === 'prod') prodBuff *= b.x;
      else if (b.k === 'click') clickBuff *= b.x;
      else if (b.k === 'stamp') stampBuff *= b.x;
      else if (b.k === 'cost') costBuff *= b.x;
      else if (b.k === 'gen') genBuff[b.gen] = (genBuff[b.gen] || 1) * b.x;
    }
    M.chaos = F.chaos ? (S.flags.chaosX || 1) : 1;
    const g0 = M.staticG * M.rechts * M.chaos;
    let base = 0, buffed = 0;
    M.genSps = {};
    for (const g of D.GENS) {
      const n = S.gens[g.id] || 0;
      if (!n) { M.genSps[g.id] = 0; continue; }
      const v = n * M.unit[g.id] * g0;
      base += v;
      const vb = v * (genBuff[g.id] || 1);
      M.genSps[g.id] = vb * prodBuff;
      buffed += vb;
    }
    M.spsBase = base;
    M.sps = buffed * prodBuff;
    M.prodBuff = prodBuff; M.clickBuff = clickBuff; M.stampBuff = stampBuff; M.costBuff = costBuff; M.genBuff = genBuff;
    // Vorschriften
    let v = 0;
    for (const g of D.GREMIEN) v += (S.grem[g.id] || 0) * g.vps;
    M.parkinson = F.noParkinson ? 1 : 1 + F.parkinson * Math.log10(1 + S.vor);
    M.vps = v * F.vX * M.parkinson;
    // Stempel
    M.clickVal = (F.clickX + F.clickPct * M.sps) * clickBuff;
    M.flowMult = 1 + FLOW_STEP * Math.floor(S.korb.flow);
    M.stampVal = M.clickVal * RESSORT_FACTOR * F.stampX * stampBuff * M.flowMult;
    M.autoVal = (F.clickX + F.clickPct * M.sps) * RESSORT_FACTOR * F.stampX * AUTO_SHARE;
  };

  /* ---------- Hilfen ---------- */
  function earn(x) {
    if (!(x > 0) || !isFinite(x)) return;
    S.akten += x; S.runAkten += x; S.totalAkten += x;
  }
  C.earn = earn;
  C.activeRessorts = function () {
    const n = Math.min(D.ERAS[S.era].ressorts, M.F ? M.F.ressortMax : 6);
    const out = [];
    for (let i = 0; i < n; i++) out.push(i);
    return out;
  };
  const eraFor = (run) => { let e = 0; for (let i = 0; i < D.ERAS.length; i++) if (run >= D.ERAS[i].at) e = i; return e; };
  C.nextEraAt = () => (S.era + 1 < D.ERAS.length ? D.ERAS[S.era + 1].at : null);

  /* ---------- Kaufen ---------- */
  C.genUnlocked = (g) => S.era >= g.era;
  C.genCost = function (id, n) {
    const g = D.GEN[id];
    n = n || 1;
    const own = S.gens[id] || 0;
    const first = g.cost * Math.pow(GROWTH, own) * M.F.cost * M.costBuff;
    return n === 1 ? first : first * (Math.pow(GROWTH, n) - 1) / (GROWTH - 1);
  };
  C.maxBuy = function (id, budget) {
    const first = C.genCost(id, 1);
    budget = budget === undefined ? S.akten : budget;
    if (budget < first) return 0;
    return Math.max(1, Math.floor(Math.log(budget * (GROWTH - 1) / first + 1) / Math.log(GROWTH)));
  };
  C.buyGen = function (id, amount) {
    const g = D.GEN[id];
    if (!g || !C.genUnlocked(g)) return 0;
    if (amount === 'max') amount = C.maxBuy(id);
    amount = Math.floor(amount || 0);
    if (amount < 1) return 0;
    const cost = C.genCost(id, amount);
    if (cost > S.akten * (1 + 1e-12)) return 0;
    S.akten = Math.max(0, S.akten - cost);
    S.gens[id] = (S.gens[id] || 0) + amount;
    C.recalc();
    U.emit('buy', { id, amount });
    return amount;
  };
  C.gremCost = function (id, n) {
    const g = D.GREM[id];
    n = n || 1;
    const own = S.grem[id] || 0;
    const first = g.cost * Math.pow(GREM_GROWTH, own) * M.F.cost * M.costBuff;
    return n === 1 ? first : first * (Math.pow(GREM_GROWTH, n) - 1) / (GREM_GROWTH - 1);
  };
  C.maxBuyGrem = function (id, budget) {
    const first = C.gremCost(id, 1);
    budget = budget === undefined ? S.akten : budget;
    if (budget < first) return 0;
    return Math.max(1, Math.floor(Math.log(budget * (GREM_GROWTH - 1) / first + 1) / Math.log(GREM_GROWTH)));
  };
  C.buyGrem = function (id, amount) {
    const g = D.GREM[id];
    if (!g || S.era < g.era) return 0;
    if (amount === 'max') amount = C.maxBuyGrem(id);
    amount = Math.floor(amount || 0);
    if (amount < 1) return 0;
    const cost = C.gremCost(id, amount);
    if (cost > S.akten * (1 + 1e-12)) return 0;
    S.akten = Math.max(0, S.akten - cost);
    S.grem[id] = (S.grem[id] || 0) + amount;
    C.recalc();
    U.emit('buyGrem', { id, amount });
    return amount;
  };

  function reqMet(r) {
    if (!r) return true;
    const st = S.stats;
    if (r.gen && (S.gens[r.gen] || 0) < r.n) return false;
    if (r.gen2 && (S.gens[r.gen2] || 0) < r.n2) return false;
    if (r.clicks && st.clicks < r.clicks) return false;
    if (r.correct && st.correct < r.correct) return false;
    if (r.flow && st.maxFlow < r.flow) return false;
    if (r.eilt && st.eilt < r.eilt) return false;
    if (r.wider && st.wider < r.wider) return false;
    if (r.forms && Object.keys(S.forms).length < r.forms) return false;
    if (r.schimmel && st.schimmel < r.schimmel) return false;
    if (r.grem && C.totalGrem() < r.grem) return false;
    return true;
  }
  C.upCost = (u) => u.cost * M.F.upCost;
  C.upVisible = (u) => !S.ups[u.id] && S.era >= u.era && reqMet(u.req);
  C.availableUpgrades = function () {
    const out = [];
    for (const u of D.UPGRADES) if (C.upVisible(u)) out.push(u);
    out.sort((a, b) => a.cost - b.cost);
    return out;
  };
  C.buyUpgrade = function (id) {
    const u = D.UP[id];
    if (!u || !C.upVisible(u)) return false;
    const cost = C.upCost(u);
    if (cost > S.akten * (1 + 1e-12)) return false;
    S.akten = Math.max(0, S.akten - cost);
    S.ups[id] = true;
    C.recalc();
    U.emit('upgrade', { id });
    return true;
  };
  C.buyAllUpgrades = function () {
    let n = 0;
    for (const u of C.availableUpgrades()) { if (C.upCost(u) <= S.akten) { if (C.buyUpgrade(u.id)) n++; } else break; }
    return n;
  };

  /* ---------- Paragrafen ---------- */
  C.paraCost = (p) => p.cost * M.F.paraCost;
  C.paraState = function (p) {
    if (S.paras[p.id]) return 'owned';
    if (p.req && !S.paras[p.req]) return 'locked';
    return 'open';
  };
  C.paraUnlocked = () => S.era >= 1 || S.vor > 0 || Object.keys(S.paras).length > 0;
  C.buyPara = function (id) {
    const p = D.PARA[id];
    if (!p || C.paraState(p) !== 'open') return false;
    const cost = C.paraCost(p);
    if (cost > S.vor * (1 + 1e-12)) return false;
    S.vor = Math.max(0, S.vor - cost);
    S.paras[id] = true;
    C.recalc();
    U.emit('para', { id });
    return true;
  };

  /* ---------- Eingangskorb ---------- */
  function senderFor() {
    if (S.era < 4) return { who: U.pick(D.SENDERS[S.era]), place: '' };
    return { who: U.pick(D.SENDERS_MODERN), place: U.pick(D.PLACES) };
  }
  function newDoc() {
    const K = S.korb;
    let d = null;
    const idx = K.pending.findIndex((p) => p.due <= K.docNo);
    if (idx >= 0) d = K.pending.splice(idx, 1)[0];
    if (!d) {
      const rs = M.ressorts || C.activeRessorts();
      const r = rs.length ? U.pick(rs) : -1;
      d = { r, type: 'normal', need: 1, prog: 0 };
      if (rs.length >= 3 && S.era >= 4 && U.rand() < GROSS_CHANCE) {
        const seq = U.shuffle(rs).slice(0, 3);
        d = { r: seq[0], seq, type: 'gross', need: 3, prog: 0 };
      } else if (rs.length && S.era >= 2 && U.rand() < EILT_CHANCE * M.F.eiltFreq) {
        d.type = 'eilt';
        d.deadline = S.gt + EILT_TIME + M.F.eiltTime;
        d.dur = EILT_TIME + M.F.eiltTime;
      }
      const key = d.r < 0 ? 'none' : D.RESSORTS[d.r].id;
      d.title = U.pick(D.TITLES[key]);
      const s = senderFor();
      d.who = s.who; d.place = s.place;
      d.az = U.randInt(10, 99) + '-' + U.randInt(100, 999) + '/' + String(U.randInt(0, 99)).padStart(2, '0');
    }
    K.docNo++;
    d.no = K.docNo;
    d.stamps = 0;
    K.doc = d;
    U.emit('docNew', d);
    return d;
  }
  C.doc = () => S.korb.doc || newDoc();

  function typeMult(d) {
    if (d.type === 'wider') return 3 * M.F.widerX;
    if (d.type === 'eilt') return S.gt <= d.deadline ? 4 * M.F.eiltX : 1;
    if (d.type === 'gross') return 4;
    return 0;
  }
  function finishDoc(d, how) {
    const K = S.korb;
    let bonus = M.clickVal;
    const tm = typeMult(d);
    if (tm > 0) bonus += M.stampVal * tm;
    earn(bonus);
    S.stats.docs++; S.run.docs++;
    if (d.type === 'wider') S.stats.wider++;
    if (d.type === 'gross') S.stats.gross++;
    if (d.type === 'eilt' && S.gt <= d.deadline) S.stats.eilt++;
    let form = null;
    const fc = FORM_CHANCE * M.F.formRate * (d.type === 'normal' ? 1 : 2);
    if (U.rand() < fc) form = rollForm();
    U.emit('docDone', { d, bonus, form, how });
    K.doc = null;
    newDoc();
  }
  function stampTimeFlags() {
    const dt = new Date(C.now());
    const h = dt.getHours(), m = dt.getMinutes();
    if (h < 4) S.flags.nacht = true;
    if (h === 12 && m < 5) S.flags.mittag = true;
    if (dt.getDay() === 1 && h < 8) S.flags.montag = true;
  }

  /** Eingangsstempel: immer erlaubt, kleiner Ertrag, 5 Stempel schließen einen Vorgang */
  C.eingang = function (auto) {
    const K = S.korb;
    const d = K.doc || newDoc();
    const gain = auto ? M.autoVal * 0.5 : M.clickVal;
    earn(gain);
    if (!auto) {
      S.stats.clicks++; S.run.clicks++; K.lastManual = S.gt; stampTimeFlags();
    } else S.stats.auto++;
    d.stamps++;
    d.prog = Math.min(d.need, d.prog + EINGANG_PROG);
    if (d.seq) d.r = d.seq[Math.min(d.seq.length - 1, Math.floor(d.prog + 1e-9))];
    U.emit('stamp', { kind: auto ? 'auto' : 'eingang', gain, d });
    if (d.prog >= d.need - 1e-9) finishDoc(d, 'eingang');
    return gain;
  };

  /** Ressortstempel: richtig = großer Ertrag + Arbeitsfluss, falsch = Widerspruch */
  C.ressort = function (r, auto) {
    const K = S.korb;
    const d = K.doc || newDoc();
    if (d.r < 0) return C.eingang(auto);
    if (!auto) { S.stats.stamps++; K.lastManual = S.gt; stampTimeFlags(); }
    if (r === d.r) {
      let gain;
      if (auto) { gain = M.autoVal; S.stats.auto++; }
      else {
        K.flow = Math.min(M.F.flowMax, Math.floor(K.flow) + 1);
        K.lastCorrect = S.gt;
        K.wrongStreak = 0;
        if (K.flow > S.stats.maxFlow) S.stats.maxFlow = K.flow;
        S.stats.correct++; S.run.correct++;
        C.dyn();
        gain = M.stampVal;
      }
      earn(gain);
      d.stamps++;
      d.prog = Math.min(d.need, Math.floor(d.prog + 1e-9) + 1);
      U.emit('stamp', { kind: auto ? 'auto' : 'correct', gain, d, flow: K.flow });
      if (d.prog >= d.need - 1e-9) finishDoc(d, auto ? 'auto' : 'ressort');
      else if (d.seq) { d.r = d.seq[Math.floor(d.prog + 1e-9)]; U.emit('docStep', d); }
      return gain;
    }
    // falscher Stempel
    S.stats.wrong++;
    K.flow = 0;
    K.wrongStreak++;
    if (K.wrongStreak >= 10) S.flags.querulant = true;
    const back = { r: d.r, type: 'wider', need: 2, prog: 0, title: d.title, who: d.who, place: d.place, az: d.az, due: K.docNo + 3, wrongR: r };
    if (K.pending.length < 8) K.pending.push(back);
    U.emit('stamp', { kind: 'wrong', gain: 0, d, r });
    K.doc = null;
    newDoc();
    C.dyn();
    return 0;
  };

  /* ---------- Formulare ---------- */
  function rollForm() {
    const pool = D.FORMS.filter((f) => !f.special && f.era <= S.maxEra);
    const rar = U.weighted(Object.keys(D.RARITY), (k) => D.RARITY[k].w);
    let cand = pool.filter((f) => f.r === rar);
    if (!cand.length) cand = pool;
    const f = U.pick(cand);
    return giveForm(f.id);
  }
  function giveForm(id) {
    const isNew = !S.forms[id];
    S.forms[id] = (S.forms[id] || 0) + 1;
    S.stats.formsFound++;
    if (isNew) C.recalc();
    const res = { id, isNew, form: D.FORM[id] };
    U.emit('form', res);
    return res;
  }
  C.giveForm = giveForm;
  C.altpapier = function () {
    let n = 0;
    for (const k in S.forms) if (S.forms[k] > 1) { n += S.forms[k] - 1; S.forms[k] = 1; }
    if (!n) return 0;
    const gain = Math.max(100, M.spsBase * 120) * n;
    earn(gain);
    S.stats.altpapier += n;
    U.emit('altpapier', { n, gain });
    return gain;
  };

  /* ---------- Buffs ---------- */
  function addBuff(b) {
    const ex = S.buffs.find((x) => x.id === b.id);
    if (ex) { ex.end = Math.max(ex.end, S.gt + b.s); ex.dur = Math.max(ex.dur, b.s); }
    else S.buffs.push({ id: b.id, k: b.k, x: b.x, gen: b.gen, name: b.name, end: S.gt + b.s, dur: b.s });
    C.dyn();
    U.emit('buff', b);
  }
  C.addBuff = addBuff;

  /* ---------- Amtsschimmel ---------- */
  function scheduleSchimmel() { S.schimmel.in = U.range(SCHIMMEL_MIN, SCHIMMEL_MAX) / M.F.schimFreq; }
  C.schimmelSoon = () => { if (!S.schimmel.active) S.schimmel.in = Math.min(S.schimmel.in, 6); };
  C.catchSchimmel = function () {
    const sc = S.schimmel;
    if (!sc.active) return null;
    sc.active = false;
    if (S.gt - sc.born <= 1) S.flags.sprint = true;
    S.stats.schimmel++; S.run.schimmel++;
    const list = D.SCHIMMEL.filter((e) => (!e.minEra || S.era >= e.minEra) && (!e.minGens || C.totalGens() > 0) && (!e.minVps || M.vps > 0));
    const e = U.weighted(list, (x) => x.w);
    const res = { id: e.id, name: e.name, text: e.text };
    if (e.buff) {
      const b = Object.assign({ id: 's_' + e.id, name: e.name }, e.buff);
      b.s = e.buff.s * M.F.schimDur;
      if (b.k === 'gen') {
        const owned = D.GENS.filter((g) => S.gens[g.id]);
        const g = U.pick(owned);
        b.gen = g.id; b.id = 's_gen_' + g.id; b.name = 'Beförderung: ' + g.plural;
        res.text = g.plural + ' arbeiten ×' + b.x + ' für ' + Math.round(b.s) + ' Sekunden.';
      }
      addBuff(b);
      res.buff = b;
    }
    if (e.lucky) {
      const gain = (Math.min(S.akten * 0.15, M.spsBase * 900) + 13) * M.F.luckyX;
      earn(gain);
      res.gain = gain;
      res.text = 'Im Haushalt war noch etwas übrig: +' + U.fmt(gain) + ' Akten.';
    }
    if (e.vor) {
      const g = Math.max(5, M.vps * e.vor);
      S.vor += g; S.runVor += g; S.totalVor += g;
      res.vor = g;
      res.text = 'Ein Gremium tagt die Nacht durch: +' + U.fmt(g) + ' Vorschriften.';
    }
    scheduleSchimmel();
    U.emit('schimmel', res);
    return res;
  };

  /* ---------- Bürgeranliegen ---------- */
  function scheduleAnliegen() { S.anliegen.in = U.range(ANL_MIN, ANL_MAX) / M.F.anlFreq; }
  function pickAnliegen() {
    const A = S.anliegen;
    const ok = D.ANLIEGEN.filter((a) => (a.minEra === undefined || S.era >= a.minEra) && (a.maxEra === undefined || S.era <= a.maxEra) &&
      A.recent.indexOf(a.id) < 0 && !(a.id === 'schilda' && S.flags.schilda) && !(a.id === 'unterausschuss' && !C.totalGrem()));
    if (!ok.length) return null;
    return U.weighted(ok, (a) => (a.rare ? 0.25 : 1));
  }
  function applyAnlFx(fx, out) {
    const F = M.F;
    const rew = F.anlRew;
    if (fx.akten) { const g = Math.max(M.clickVal * 20, M.spsBase * 60 * fx.akten) * rew; earn(g); out.push('+' + U.fmt(g) + ' Akten'); }
    if (fx.vor) {
      const g = Math.max(3 * fx.vor / 10, M.vps * 60 * fx.vor) * rew;
      S.vor += g; S.runVor += g; S.totalVor += g; out.push('+' + U.fmt(g, { dec: 1 }) + ' Vorschriften');
    }
    const timed = (k, arr, name) => {
      const x = arr[0] >= 1 ? 1 + (arr[0] - 1) * rew : arr[0];
      addBuff({ id: 'a_' + k + '_' + U.randInt(0, 1e6), k, x, s: arr[1], name });
    };
    if (fx.prod) timed('prod', fx.prod, fx.prod[0] >= 1 ? 'Bürgerfreude' : 'Durchhänger');
    if (fx.click) timed('click', fx.click, 'Stempeleifer');
    if (fx.stamp) timed('stamp', fx.stamp, 'Fortbildung');
    if (fx.flow) { S.korb.flow = Math.min(F.flowMax, S.korb.flow + fx.flow); S.korb.lastCorrect = S.gt; }
    if (fx.form) for (let i = 0; i < fx.form; i++) { const r = rollForm(); out.push('Formular: ' + r.form.name); }
    if (fx.schimmel) C.schimmelSoon();
    if (fx.flag) { S.flags[fx.flag] = true; }
  }
  C.answerAnliegen = function (i) {
    const A = S.anliegen;
    if (!A.cur) return null;
    const a = D.ANL[A.cur];
    const opt = a && a.opts[i];
    if (!opt) return null;
    const out = [];
    let res = opt.res || '';
    if (opt.fx.chance) {
      const ch = opt.fx.chance;
      const won = U.rand() < ch.p;
      const br = won ? ch.win : ch.lose;
      res = br.res;
      applyAnlFx(br, out);
    } else applyAnlFx(opt.fx, out);
    A.cur = null;
    A.recent.push(a.id);
    if (A.recent.length > 8) A.recent.shift();
    S.stats.anliegen++;
    scheduleAnliegen();
    const r = { id: a.id, res, gains: out };
    U.emit('anliegenDone', r);
    return r;
  };

  /* ---------- Großprojekte ---------- */
  C.projState = function (id) {
    const p = D.PROJ[id];
    const st = S.projects[id] || { stage: 0, delays: 0, done: false };
    return { p, stage: st.stage, delays: st.delays || 0, done: !!st.done };
  };
  C.projVisible = (id) => (S.era >= D.PROJ[id].era || !!(S.projects[id] && S.projects[id].done)) && !(D.PROJ[id].finale && S.finale.done);
  C.portalReady = function () {
    const reasons = [];
    if (S.era < 9) reasons.push('Epoche „Das Weltamt“ erreichen');
    const distinct = Object.keys(S.visited).length;
    if (distinct < 5) reasons.push('mindestens 5 verschiedene Leitbilder erleben (bisher ' + distinct + ')');
    return { ok: reasons.length === 0, reasons };
  };
  C.projCost = function (id) {
    const st = C.projState(id);
    if (st.done) return Infinity;
    const p = st.p;
    let c = p.stages[Math.min(st.stage, p.stages.length - 1)].cost;
    if (p.delays && st.stage === p.stages.length - 1) c *= Math.pow(p.delayX, st.delays);
    return c * M.F.projCost;
  };
  C.projStageName = function (id) {
    const st = C.projState(id);
    if (st.done) return 'Abgeschlossen';
    const p = st.p;
    if (p.delays && st.stage === p.stages.length - 1 && st.delays > 0) return p.delayNames[st.delays - 1] + ', dann Eröffnung';
    return p.stages[st.stage].name;
  };
  C.fundProject = function (id) {
    const p = D.PROJ[id];
    if (!p || !C.projVisible(id)) return null;
    if (p.finale && (S.finale.done || !C.portalReady().ok)) return null;
    const st = S.projects[id] = S.projects[id] || { stage: 0, delays: 0, done: false };
    if (st.done) return null;
    const cost = C.projCost(id);
    if (cost > S.akten * (1 + 1e-12)) return null;
    S.akten = Math.max(0, S.akten - cost);
    const last = st.stage === p.stages.length - 1;
    if (last && p.delays && st.delays < p.delays) {
      st.delays++;
      const r = { id, delayed: true, reason: p.delayNames[st.delays - 1], delays: st.delays };
      U.emit('projDelay', r);
      return r;
    }
    if (!last) { st.stage++; U.emit('projStage', { id, stage: st.stage }); return { id, stage: st.stage }; }
    st.done = true;
    if (id === 'flughafen') { const f = D.FORMS.find((x) => x.special === 'flughafen'); if (f) giveForm(f.id); }
    C.recalc();
    if (p.finale) { S.finale.done = true; S.finale.at = C.now(); C.recalc(); U.emit('finale', {}); }
    U.emit('projDone', { id });
    return { id, done: true };
  };

  /* ---------- Reform (Prestige) ---------- */
  C.djTotalFor = (total) => Math.floor(Math.pow(Math.max(0, total) / DJ_DIV, 1 / 3) * M.F.djGain + 1e-9);
  C.djGain = () => Math.max(0, C.djTotalFor(S.totalAkten) - S.dj);
  C.nextDjAt = function () {
    const target = S.dj + C.djGain() + 1;
    return Math.pow(target / M.F.djGain, 3) * DJ_DIV;
  };
  C.leitbildUnlocked = (id) => !!(D.LB[id] && D.LB[id].unlock(S));
  C.reform = function (lbId) {
    const gain = C.djGain();
    if (gain < 1) return null;
    if (!C.leitbildUnlocked(lbId)) return null;
    const F = M.F;
    const firstVisit = !S.visited[lbId];
    S.stats.bestRun = Math.max(S.stats.bestRun, S.runAkten);
    S.dj += gain; S.pp += gain;
    S.stats.reforms++;
    S.streak = lbId === S.leitbild ? Math.min(3, S.streak + 1) : 0;
    S.leitbild = lbId;
    S.visited[lbId] = (S.visited[lbId] || 0) + 1;
    const keepI = F.flags.keepI, keepAll = F.flags.keepAll;
    let paras = {};
    if (keepAll) paras = S.paras;

    S.akten = 0; S.runAkten = 0; S.vor = 0; S.runVor = 0;
    S.gens = {}; S.grem = {}; S.ups = {}; S.paras = paras;
    S.era = 0;
    S.korb = { doc: null, pending: [], flow: 0, lastCorrect: -99, lastManual: -99, docNo: S.korb.docNo, autoAcc: 0, wrongStreak: 0 };
    S.buffs = []; S.projects = {};
    S.anliegen.cur = null;
    S.run = { start: C.now(), gt: 0, clicks: 0, correct: 0, docs: 0, schimmel: 0 };
    S.flags.chaosX = 1;
    C.recalc();
    applyStartPerks();

    return r;

  function applyStartPerks() {
    const F = M.F;
    if (F.flags.startEra) {

    }
    if (F.flags.startgeld) earnStart(S.stats.maxSpsBase * 300);
  }
  function earnStart(x) { if (x > 0 && isFinite(x)) { S.akten += x; } }

  /* ---------- Laufbahn ---------- */
  C.perkState = function (p) {
    if (S.perks[p.id]) return 'owned';

    if (idx > 0) {

    return 'open';
  };
  C.buyPerk = function (id) {
    const p = D.PERK[id];

    S.pp -= p.cost;
    S.perks[id] = true;
    C.recalc();
    U.emit('perk', { id });
    return true;
  };
  C.stufeCost = () => Math.round(D.STUFE.base * Math.pow(D.STUFE.growth, S.stufe));
  C.buyStufe = function () {
    const c = C.stufeCost();
    if (S.pp < c) return false;
    S.pp -= c; S.stufe++;

    U.emit('perk', { id: 'stufe' });
    return true;
  };

  /* ---------- Urkunden ---------- */
  function checkAchievements() {
    let any = false;
    for (const a of D.ACH) {
      if (S.ach[a.id]) continue;
      let ok = false;
      try { ok = a.check(S, C); } catch (e) { ok = false; }
      if (ok) { S.ach[a.id] = C.now(); any = true; U.emit('ach', a); }

  }
  C.checkAchievements = checkAchievements;
  C.mascotClick = function () { S.flags.wieher = (S.flags.wieher || 0) + 1; return U.pick(D.QUIPS); };

  /* ---------- Automatik ---------- */
  function autoBuy() {
    const F = M.F;
    if (F.flags.autoUp && S.settings.autoUp) C.buyAllUpgrades();
    if (F.flags.autoGen && S.settings.autoGen) {
      for (let k = 0; k < 40; k++) {
        let best = null, bestScore = Infinity;
        const g0 = M.staticG * M.rechts;
        for (const g of D.GENS) {
          if (!C.genUnlocked(g)) continue;
          const c = C.genCost(g.id, 1);
          const gain = M.unit[g.id] * g0;
          const score = c / Math.max(gain, 1e-300);
          if (score < bestScore) { bestScore = score; best = { id: g.id, c }; }
        }
        if (!best || best.c > S.akten) break;
        C.buyGen(best.id, 1);
      }
      for (const g of D.GREMIEN) {
        if (S.era < g.era) continue;
        while (C.gremCost(g.id, 1) <= S.akten * 0.05) { if (!C.buyGrem(g.id, 1)) break; }
      }
    }
  }

  /* ---------- Hauptschleife ---------- */

      S.buffs = S.buffs.filter((b) => b.end > S.gt);
      if (S.buffs.length !== before) U.emit('buffEnd', {});
    }
    C.dyn();
    earn(M.sps * dt);
    if (M.vps > 0) { const v = M.vps * dt; S.vor += v; S.runVor += v; S.totalVor += v; }
    if (M.spsBase > S.stats.maxSpsBase) S.stats.maxSpsBase = M.spsBase;
    if (M.sps > S.stats.maxSps) S.stats.maxSps = M.sps;

    const K = S.korb;
    if (!K.doc) newDoc();
    // Arbeitsfluss verfällt
    if (K.flow > 0 && S.gt - K.lastCorrect > FLOW_HOLD) K.flow = Math.max(0, K.flow - FLOW_DECAY * M.F.flowDecay * dt);

      K.doc = null; newDoc();
    }
    // Vertretung
    if (M.F.auto > 0 && S.gt - K.lastManual >= AUTO_IDLE) {
      K.autoAcc += M.F.auto * dt;
      let guard = 0;
      while (K.autoAcc >= 1 && guard++ < 20) {

        if (d.r < 0) C.eingang(true); else C.ressort(d.r, true);
      }

    } else K.autoAcc = 0;

      } else {
        sc.in -= dt;
        if (sc.in <= 0) {
          sc.active = true; sc.born = S.gt; sc.until = S.gt + SCHIMMEL_LIFE + M.F.schimLife;

        }
      }
      // Bürgeranliegen
      const A = S.anliegen;
      if (A.cur) {
        if (S.gt > A.until) { A.recent.push(A.cur); if (A.recent.length > 8) A.recent.shift(); A.cur = null; scheduleAnliegen(); U.emit('anliegenGone', {}); }
      } else if (S.era >= 0 && S.gt > 60) {
        A.in -= dt;
        if (A.in <= 0) {

        }

    }
    if (S.runAkten >= 1e6 && S.run.clicks === 0 && S.run.correct === 0 && S.stats.reforms > 0) S.flags.reinverwaltung = true;

    if (slowAcc >= 1) { slowAcc = 0; autoBuy(); }
    achAcc += dt;

  }
  C.tick = function (dt) {
    if (!S || !(dt > 0)) return;
    if (dt > 3600) { // sehr große Lücke: wie Offline behandeln, aber ohne Abschlag

      return;
    }
    while (dt > 1e-9) {
      const d = Math.min(dt, 1);
      step(d);
      dt -= d;
    }
  };

  /* ---------- Offline ---------- */
  C.offlineEff = () => Math.min(1, M.F.offEff);
  C.offlineCapH = () => M.F.offCap;
  C.applyOffline = function (sec, effOverride) {
    if (!(sec > 0)) return null;
    const eff = effOverride || C.offlineEff();
    const t = Math.min(sec, C.offlineCapH() * 3600);
    S.buffs = [];
    C.dyn();
    const gain = M.spsBase * t * eff;
    let vGain = 0;
    if (M.vps > 0) {
      // Parkinson: in Schritten integrieren, damit das Wachstum der Vorschriften mitzählt
      const steps = 40, h = t / steps;
      for (let i = 0; i < steps; i++) { C.dyn(); const v = M.vps * h * eff; S.vor += v; S.runVor += v; S.totalVor += v; vGain += v; }
    }
    earn(gain);
    S.stats.offlineAkten += gain;
    const e = Math.max(S.era, eraFor(S.runAkten));
    if (e > S.era) { S.era = e; if (e > S.maxEra) { S.maxEra = e; S.stats.eraTimes[e] = S.stats.eraTimes[e] || Math.round(S.stats.playTime); } }
    C.recalc();
    checkAchievements();
    const r = { sec, t, gain, vGain, eff, capped: sec > t };
    U.emit('offline', r);
    return r;
  };

  /* ---------- Speichern & Laden ---------- */
  const MAPS = {
    gens: ['num', D.GEN], grem: ['num', D.GREM], ups: ['true', D.UP], paras: ['true', D.PARA], perks: ['true', D.PERK],
    forms: ['num', D.FORM], ach: ['num', D.ACHS], visited: ['num', D.LB], projects: ['obj', D.PROJ],
    flags: ['any', null], tips: ['any', null], 'stats.eraTimes': ['num', null],
  };
  function cleanMap(src, spec) {
    const [type, known] = spec;
    const out = {};
    for (const k in src) {
      if (known && !known[k]) continue;
      const v = src[k];
      if (type === 'num') { if (typeof v === 'number' && isFinite(v) && v >= 0) out[k] = v; }
      else if (type === 'true') { if (v === true) out[k] = true; }
      else if (type === 'obj') { if (v && typeof v === 'object' && !Array.isArray(v)) out[k] = { stage: Math.max(0, Math.floor(+v.stage || 0)), delays: Math.max(0, Math.floor(+v.delays || 0)), done: !!v.done }; }
      else if (type === 'any') { if (['number', 'string', 'boolean'].indexOf(typeof v) >= 0 && (typeof v !== 'number' || isFinite(v))) out[k] = v; }
    }

  }
  function sanitize(def, src, path) {
    if (MAPS[path]) return src && typeof src === 'object' && !Array.isArray(src) ? cleanMap(src, MAPS[path]) : def;
    if (def === null) return src && typeof src === 'object' ? src : null;
    if (src === undefined || src === null) return def;
    if (Array.isArray(def)) return Array.isArray(src) ? src : def;
    if (typeof def === 'number') return typeof src === 'number' && isFinite(src) ? Math.max(0, src) : def;

    if (typeof def === 'string') return typeof src === 'string' ? src : def;

  // Migrationen: MIGRATIONS[n] hebt einen Spielstand von Version n auf n + 1
  C.MIGRATIONS = {
    0: (s) => { // Vorabversion: Vorschriften hießen „paragraphs“, Leitbild fehlte

      if (!s.leitbild) s.leitbild = 'kameral';
      return s;
    },
  };
  C.migrate = function (s) {
    let v = typeof s.v === 'number' ? s.v : 0;

      if (fn) s = fn(s) || s;
      v++;
      s.v = v;
    }
    return s;
  };
  function validateLoaded(s) {

    if (!s.visited[s.leitbild]) s.visited[s.leitbild] = 1;
    s.era = Math.min(D.ERAS.length - 1, Math.floor(s.era));
    s.maxEra = Math.max(s.era, Math.min(D.ERAS.length - 1, Math.floor(s.maxEra)));
    s.streak = Math.min(3, Math.floor(s.streak));
    s.buffs = s.buffs.filter((b) => b && typeof b.end === 'number' && typeof b.x === 'number' && isFinite(b.x) && ['prod', 'click', 'stamp', 'cost', 'gen'].indexOf(b.k) >= 0);
    const K = s.korb;
    if (!Array.isArray(K.pending)) K.pending = [];
    K.pending = K.pending.filter((p) => p && typeof p.r === 'number').slice(0, 8);
    const okDoc = (d) => d && typeof d.r === 'number' && d.r < D.RESSORTS.length && typeof d.need === 'number' && typeof d.prog === 'number' && typeof d.title === 'string';
    if (!okDoc(K.doc)) K.doc = null;
    if (s.anliegen.cur && !D.ANL[s.anliegen.cur]) s.anliegen.cur = null;
    if (!Array.isArray(s.anliegen.recent)) s.anliegen.recent = [];

    return s;
  }
  C.fromObject = function (obj) {
    if (!obj || typeof obj !== 'object') throw new Error('Kein Spielstand');
    if (typeof obj.v === 'number' && obj.v > C.VERSION) { const e = new Error('Spielstand stammt aus einer neueren Version'); e.future = true; throw e; }
    const m = C.migrate(obj);
    return validateLoaded(sanitize(newState(), m, ''));
  };
  C.serialize = function () {
    S.lastSave = C.now();
    S.settings.numFmt = U.numFmt;
    return JSON.stringify(S);
  };
  C.save = function () {
    if (!C.storage || !S) return false;
    try {
      const str = C.serialize();
      C.storage.set(C.SAVE_KEY, str);
      if (S.gt - S.lastBackup >= 600 || !S.lastBackup) {
        S.lastBackup = S.gt;
        let list = [];
        try { list = JSON.parse(C.storage.get(C.BACKUP_KEY) || '[]'); } catch (e) { list = []; }
        const key = 'amtsschimmel.backup.' + (list.length ? (list[list.length - 1].n + 1) % 3 : 0);
        C.storage.set(key, str);
        list = list.filter((b) => b.key !== key);
        list.push({ key, n: +key.slice(-1), t: C.now(), total: S.totalAkten });
        C.storage.set(C.BACKUP_KEY, JSON.stringify(list.slice(-3)));
      }
      return true;
    } catch (e) {
      U.emit('saveError', { error: String(e && e.message || e) });
      return false;
    }
  };
  C.listBackups = function () {
    if (!C.storage) return [];
    try { return JSON.parse(C.storage.get(C.BACKUP_KEY) || '[]').filter((b) => C.storage.get(b.key)).sort((a, b) => b.t - a.t); } catch (e) { return []; }
  };
  /** Lädt den Spielstand. Liefert { fresh, offline, problem } */
  C.load = function () {
    const info = { fresh: true, offline: null, problem: null };
    let raw = null;
    if (C.storage) { try { raw = C.storage.get(C.SAVE_KEY); } catch (e) { raw = null; } }
    if (raw) {
      try {
        S = C.fromObject(JSON.parse(raw));

      } catch (e) {

    if (!$('mascotBubble').hidden) return;
    for (const t of D.TIPS) {
      if (S.tips[t.id]) continue;
      let ok = false;
      try { ok = t.when(S, C); } catch (e) { ok = false; }
      if (ok) {
        S.tips[t.id] = 1;
        if (t.id === 'flughafen') S.flags.tipFlug = true;

    // EILT-Timer
    if (d && d.type === 'eilt' && docEl) {
      const t = docEl.querySelector('.doc-timer i');
      if (t) t.style.transform = 'scaleX(' + U.clamp((d.deadline - S.gt) / d.dur, 0, 1) + ')';
    }

    $('stampbar').querySelectorAll('.stamp-btn').forEach((b) => b.classList.toggle('hint', !!assist && b.dataset.stamp === String(d.r)));

    $('docSlot').addEventListener('keydown', (e) => {
      if ((e.key === 'Enter') && e.target.classList.contains('doc')) { e.preventDefault(); Desk.eingang(); }

    $('stampbar').addEventListener('click', (e) => {

    $('mascotHead').addEventListener('click', () => {

    $('mascotBubble').addEventListener('click', (e) => { if (e.target.closest('[data-tipok]')) $('mascotBubble').hidden = true; });

    U.on('stamp', onStamp);
    U.on('docDone', onDocDone);
    U.on('docNew', onDocNew);

    U.on('eiltMissed', onEiltMissed);

    U.on('schimmelSpawn', spawnSchimmel);
    U.on('schimmelGone', removeSchimmel);
    U.on('era', () => { lastRessortSig = ''; });
    Desk.reset();
